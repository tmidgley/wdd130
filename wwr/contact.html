<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact White Knuckle Rapids to plan your white water rafting adventure. Find our location, send a message, or ask trip questions today.">
  <meta name="author" content="Travis Midgley">
  <title>Contact Us: White Knuckle Rapids</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header class="site-header">
    <a class="logo-link" href="index.html">
      <img class="logo" src="images/basic-logo.png" alt="White Knuckle Rapids logo" width="200">
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a class="active" href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <section class="address">
      <h1>Contact White Knuckle Rapids</h1>
      <ul>
        <li>123 Klamath River Road, Yreka, CA 96097</li>
        <li>(555) 123-4567</li>
        <li>info@whiteknucklerapids.com</li>
      </ul>
    </section>

    <section class="contact-grid">
      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11224.655218886213!2d-122.63597992322362!3d41.82771788115921!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54cedfeda202daa3%3A0x469797d3a570ff33!2sKlamath%20River!5e0!3m2!1sen!2sus!4v1769302896675!5m2!1sen!2sus"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </div>

      <div class="form">
        <form action="#" method="post">
          <div class="form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-row">
            <p class="row-label">Message purpose</p>
            <div class="radio-stack">
              <label class="radio-option" for="purpose-general">
                <input type="radio" id="purpose-general" name="purpose" value="general" required>
                General Inquiry
              </label>

              <label class="radio-option" for="purpose-reservation">
                <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                Reservation Question
              </label>

              <label class="radio-option" for="purpose-website">
                <input type="radio" id="purpose-website" name="purpose" value="website">
                Website Suggestion
              </label>
            </div>
          </div>

          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <div class="form-row">
            <span class="row-label"></span>
            <label class="newsletter" for="newsletter">
              <input type="checkbox" id="newsletter" name="newsletter">
              Please subscribe me to the monthly newsletter
            </label>
          </div>

          <div class="form-row">
            <span class="row-label"></span>
            <button type="submit">Send message</button>
          </div>
        </form>
      </div>
    </section>

    <section class="employees">
      <h2>Meet Our Team</h2>

      <div class="employee-grid">
        <figure class="employee-card">
          <img src="images/employee1.png" alt="Ava Torres, lead rafting guide">
          <figcaption>Ava Torres — Lead Guide</figcaption>
        </figure>

        <figure class="employee-card">
          <img src="images/employee2.png" alt="Marcus Hill, reservations specialist">
          <figcaption>Marcus Hill — Reservations</figcaption>
        </figure>

        <figure class="employee-card">
          <img src="images/employee3.png" alt="Jenna Park, safety coordinator">
          <figcaption>Jenna Park — Safety Coordinator</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 White Knuckle Rapids | Travis Midgley</p>

    <nav class="socialmedia" aria-label="Social media links">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener">
        <img src="images/facebook.png" alt="Facebook icon">
      </a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener">
        <img src="images/linkedin.png" alt="LinkedIn icon">
      </a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener">
        <img src="images/instagram.png" alt="Instagram icon">
      </a>
    </nav>
  </footer>
</body>

</html>
